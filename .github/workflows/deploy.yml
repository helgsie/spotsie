name: CI/CD Deploy to Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Lint code
        run: npm run lint

      - name: Build Next.js app
        run: npm run build

      - name: Deploy to Render
        run: |
          curl -X POST https://api.render.com/deploy/srv-cvv5d40gjchc73c3noug?key=EwZumBYFwas
      